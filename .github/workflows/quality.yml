name: Quality checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install Riven and CI tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install -r requirements/ci.txt
      - name: Ruff lint
        run: ruff check riven
      - name: Ruff format check
        run: ruff format --check riven
      - name: Codespell
        run: codespell riven README.md pyproject.toml MANIFEST.in requirements/ci.txt .github/workflows/quality.yml
      - name: Pylint import and circular import checks
        run: pylint --disable=all --enable=E0401,E0402,E0611,R0401 --ignored-modules=uvloop,winloop riven
      - name: Check source distribution manifest
        run: check-manifest
